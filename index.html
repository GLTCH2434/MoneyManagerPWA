<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Money Manager</title>

<meta name="theme-color" content="#3B82F6">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="apple-mobile-web-app-title" content="Money Manager">

<link rel="manifest" href="manifest.json">
    
<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
    
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>

<div class="app">

<header class="topBar">

    <div>

        <h1>Money Manager</h1>

        <p class="subtitle">
            Track every rupee.
        </p>

    </div>

    <div class="topBarActions">
        <button onclick="showMonthDialog()" class="topBarBtn" title="Generate Report" aria-label="Generate Report">
            📄
        </button>
        <button onclick="showStatsDialog()" class="topBarBtn" title="Live Stats" aria-label="Live Stats">
            📊
        </button>
        <button onclick="showBudgetsDialog()" class="topBarBtn" title="Budgets" aria-label="Budgets">
            🎯
        </button>
    </div>

</header>

<!-- BALANCE CARD -->

<section class="balanceCard">

    <p>Total Balance</p>

    <h2 id="bal">₹0</h2>

    <div class="stats">

        <div class="incomeCard">

            <small>Income</small>

            <h3 id="inc">₹0</h3>

        </div>

        <div class="expenseCard">

            <small>Expense</small>

            <h3 id="exp">₹0</h3>

        </div>

    </div>

    <button id="fab" onclick="openModal()" class="primaryBtn" style="margin-top:20px;">
        + Add Transaction
    </button>

</section>

<!-- ADD TRANSACTION -->





<!-- HISTORY -->

<section class="card">

<h2>

Recent Transactions

</h2>

<ul id="list">

</ul>

</section>





<!-- REPORT DIALOG -->

<div id="monthDialog" class="dialog">
    <div class="dialogBox">
        <h2>Select Month</h2>
        <select id="reportMonth"></select>
        <button onclick="generateMonthlyPDF()">
            Export
        </button>
        <button onclick="closeMonthDialog()">
            Cancel
        </button>
    </div>
</div>

<!-- LIVE STATS DIALOG -->

<div id="statsDialog" class="dialog">
    <div class="dialogBox">
        <h2>Live Statistics</h2>
        <div id="statsContent"></div>
        <button onclick="closeStatsDialog()">
            Close
        </button>
    </div>
</div>

<!-- BUDGETS DIALOG -->

<div id="budgetsDialog" class="dialog">
    <div class="dialogBox">
        <h2>Budgets</h2>
        <div id="budgetsContent"></div>
        <button onclick="closeBudgetsDialog()">
            Close
        </button>
    </div>
</div>



<!-- Bottom Sheet -->

<div id="overlay" onclick="closeModal()"></div>

<div id="modal">

<h2>Add Transaction</h2>

<input
id="amt"
type="number"
placeholder="Amount">

<select id="type">

<option>Expense</option>

<option>Income</option>

</select>

<select id="cat">

<option>🍔 Food</option>
<option>🚗 Transport</option>
<option>🛍 Shopping</option>
<option>💡 Bills</option>
<option>🎬 Entertainment</option>
<option>💼 Salary</option>
<option>🏥 Medical</option>
<option>✈ Travel</option>
<option>🏦 Savings</option>
<option>💳 EMI</option>
<option>🎁 Gifts</option>
<option>📦 Other</option>

</select>

<input
id="note"
placeholder="Reason">

<button onclick="saveTransaction()">

Save

</button>

</div>

<!-- Budget Modal -->
<div id="budgetModal">
    <div class="modalHeader">
        <h2 id="budgetModalTitle">Add Budget</h2>
        <button class="modalCloseBtn" onclick="closeBudgetModal()" aria-label="Close">
            ✕
        </button>
    </div>
    <input
    id="budgetName"
    type="text"
    placeholder="Budget name (e.g., Vacation, Groceries)">
    <input
    id="budgetAmount"
    type="number"
    placeholder="Amount"
    step="0.01"
    min="0">
    <select id="budgetCategory">
        <option value="">-- Standalone (manual tracking) --</option>
        <option value="🍔 Food">🍔 Food</option>
        <option value="🚗 Transport">🚗 Transport</option>
        <option value="🛍 Shopping">🛍 Shopping</option>
        <option value="💡 Bills">💡 Bills</option>
        <option value="🎬 Entertainment">🎬 Entertainment</option>
        <option value="💼 Salary">💼 Salary</option>
        <option value="🏥 Medical">🏥 Medical</option>
        <option value="✈ Travel">✈ Travel</option>
        <option value="🏦 Savings">🏦 Savings</option>
        <option value="💳 EMI">💳 EMI</option>
        <option value="🎁 Gifts">🎁 Gifts</option>
        <option value="📦 Other">📦 Other</option>
    </select>
    <input
    id="budgetNote"
    placeholder="Optional note">
    <button onclick="saveBudget()">
    Save
    </button>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.1/dist/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.3/dist/jspdf.plugin.autotable.min.js"></script>

<script src="app.js"></script>

</div>

</body>

</html>
