<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Money Manager</title></head><body>
<h1>Money Manager</h1>
<div class="card"><h2 id="bal">Balance ₹0</h2><p id="inc">Income ₹0</p><p id="exp">Expense ₹0</p></div>
<div class="card">
<input id="amt" type="number" placeholder="Amount">
<select id="type"><option>Expense</option><option>Income</option></select>
<select id="cat"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Salary</option><option>Entertainment</option><option>Other</option></select>
<input id="note" placeholder="Note">
<button onclick="addTx()">Save</button>
</div>
<div class="card"><h2>Transactions</h2><ul id="list"></ul></div>
<button onclick="exportPDF()">Export Monthly PDF</button>
<script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.1/dist/jspdf.umd.min.js"></script>
<script src="app.js"></script></body></html>
